name: Release from tag

# Only LibreNostr release tags. The imported history carries 396 upstream tags
# (31 of them `ios-*`); matching `v*` keeps this workflow from firing on any of
# them if they are ever pushed, and replaces the old `'*'` + `'!ios-*'` pair.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build, sign and publish APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Without the release keystore, `altRelease` silently falls back to the
      # debug signing config and would publish APKs that cannot upgrade a real
      # install. Releases are currently cut by hand, so report and stop rather
      # than either shipping debug-signed APKs or failing the tag permanently.
      - name: Check for signing material
        id: signing
        env:
          CONFIG_PROPERTIES: ${{ secrets.CONFIG_PROPERTIES }}
          CERT_ALTERNATIVE: ${{ secrets.CERT_ALTERNATIVE }}
        run: |
          if [ -n "$CONFIG_PROPERTIES" ] && [ -n "$CERT_ALTERNATIVE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured; skipping the build."
            echo "::notice::Set CONFIG_PROPERTIES and CERT_ALTERNATIVE to publish from CI."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache gradle
        if: steps.signing.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # There is no google-services unpacking step: the Google Play flavor and its
      # stub json files are gone. The old workflow decoded absent secrets over the
      # committed stubs, which failed every job with "Malformed root json".
      - name: Unpack signing material
        if: steps.signing.outputs.available == 'true'
        env:
          CONFIG_PROPERTIES_B64: ${{ secrets.CONFIG_PROPERTIES }}
          CERT_ALTERNATIVE_B64: ${{ secrets.CERT_ALTERNATIVE }}
          NOSTR_BUILD_GIF_API_KEY: ${{ secrets.NOSTR_BUILD_GIF_API_KEY }}
        run: |
          echo "::notice::raw env var lengths: config=${#CONFIG_PROPERTIES_B64} cert=${#CERT_ALTERNATIVE_B64}"
          openssl base64 -d -out config.properties <<< "$CONFIG_PROPERTIES_B64"
          openssl base64 -d -out app/librenostr-release.jks <<< "$CERT_ALTERNATIVE_B64"

          # The nostr.build GIF API key is its own secret, so adding it never means re-encoding the
          # whole CONFIG_PROPERTIES file (signing passwords included). A key already inside
          # CONFIG_PROPERTIES wins and is left alone.
          if ! grep -q '^nostrBuildGifApiKey=' config.properties && [ -n "$NOSTR_BUILD_GIF_API_KEY" ]; then
            # The decoded file may not end in a newline, so start a fresh line before appending.
            printf '\nnostrBuildGifApiKey=%s\n' "$NOSTR_BUILD_GIF_API_KEY" >> config.properties
          fi

          # Without the key the app still works, but its GIF picker silently falls back to GIFverse and
          # the registered access nostr.build was paid for goes unused. That is not a release to ship
          # unnoticed, so it stops here instead.
          if ! grep -q '^nostrBuildGifApiKey=gnb_' config.properties; then
            echo "::error::No nostr.build GIF API key for this release. Add the NOSTR_BUILD_GIF_API_KEY secret."
            exit 1
          fi
          keystore_bytes=$(wc -c < app/librenostr-release.jks)
          echo "::notice::keystore bytes=$keystore_bytes sha256=$(sha256sum app/librenostr-release.jks | cut -d' ' -f1)"
          echo "::notice::config.properties bytes=$(wc -c < config.properties)"
          if [ "$keystore_bytes" -lt 1000 ]; then
            echo "::error::Decoded keystore is only $keystore_bytes bytes, too small to be real. Aborting before a wasted build."
            exit 1
          fi

      - name: Build signed APKs
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew assembleAltRelease --no-daemon

      - name: Collect release assets
        if: steps.signing.outputs.available == 'true'
        id: assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          ls -la app/build/outputs/apk/altRelease/
          for abi in arm64-v8a; do
            cp "app/build/outputs/apk/altRelease/librenostr-${version}-${abi}.apk" \
               "release/librenostr-${version}-${abi}.apk"
          done
          (cd release && sha256sum librenostr-*.apk > SHA256SUMS.txt)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A debug-signed APK is the one failure mode that would look successful all
      # the way to the release page, so assert the real key before publishing.
      - name: Verify signatures
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          for apk in release/librenostr-*.apk; do
            "$apksigner" verify --print-certs "$apk"
            if "$apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed; the release keystore was not applied."
              exit 1
            fi
          done

      - name: Extract release notes from CHANGELOG
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          awk -v v="${{ steps.assets.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No [${{ steps.assets.outputs.version }}] section in CHANGELOG.md."
            exit 1
          fi

      - name: Publish release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LibreNostr ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            release/librenostr-*.apk
            release/SHA256SUMS.txt
